basePath: /api
definitions:
  ginutils.Ret-any:
    properties:
      code:
        type: integer
      data: {}
      message: {}
    type: object
  ginutils.Ret-array_response_BuildingResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.BuildingResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_response_PermissionResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.PermissionResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_response_RoleResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.RoleResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_response_RoomResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.RoomResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-response_BuildingResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/response.BuildingResponse'
      message: {}
    type: object
  ginutils.Ret-response_RoomResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/response.RoomResponse'
      message: {}
    type: object
  ginutils.Ret-response_TokenResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/response.TokenResponse'
      message: {}
    type: object
  ginutils.Ret-string:
    properties:
      code:
        type: integer
      data:
        type: string
      message: {}
    type: object
  requests.AccountRolesCommand:
    properties:
      accountID:
        minimum: 1
        type: integer
      role_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - accountID
    - role_ids
    type: object
  requests.CreateBuildingCommand:
    properties:
      address:
        maxLength: 255
        type: string
      city:
        maxLength: 255
        type: string
      default_meter_item_ids:
        items:
          type: integer
        type: array
      name:
        maxLength: 255
        type: string
      province:
        maxLength: 255
        type: string
    required:
    - address
    - city
    - name
    - province
    type: object
  requests.CreatePermissionItem:
    properties:
      api_path:
        type: string
      code:
        type: string
      description:
        type: string
    required:
    - api_path
    - code
    - description
    type: object
  requests.CreatePermissionsCommand:
    properties:
      permissions:
        items:
          $ref: '#/definitions/requests.CreatePermissionItem'
        minItems: 1
        type: array
    required:
    - permissions
    type: object
  requests.CreateRoleItem:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  requests.CreateRolesCommand:
    properties:
      roles:
        items:
          $ref: '#/definitions/requests.CreateRoleItem'
        minItems: 1
        type: array
    required:
    - roles
    type: object
  requests.CreateRoomCommand:
    properties:
      building_id:
        minimum: 1
        type: integer
      floor:
        type: integer
      price:
        minimum: 1
        type: integer
      room_no:
        type: string
      room_type_id:
        minimum: 1
        type: integer
      size:
        type: integer
    required:
    - building_id
    - price
    - room_no
    - room_type_id
    type: object
  requests.CreateRoomInBuildingCommand:
    properties:
      buildingID:
        minimum: 1
        type: integer
      floor:
        type: integer
      price:
        minimum: 1
        type: integer
      room_no:
        type: string
      room_type_id:
        minimum: 1
        type: integer
      size:
        minimum: 1
        type: integer
    required:
    - buildingID
    - price
    - room_no
    - room_type_id
    - size
    type: object
  requests.RefreshTokenReq:
    properties:
      refresh_token:
        type: string
    type: object
  requests.RolePermissionsCommand:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
      roleID:
        minimum: 1
        type: integer
    required:
    - permission_ids
    - roleID
    type: object
  requests.UpdateBuildingCommand:
    properties:
      address:
        maxLength: 255
        type: string
      buildingID:
        minimum: 1
        type: integer
      city:
        maxLength: 255
        type: string
      default_meter_item_ids:
        items:
          type: integer
        type: array
      name:
        maxLength: 255
        type: string
      province:
        maxLength: 255
        type: string
    required:
    - address
    - buildingID
    - city
    - name
    - province
    type: object
  requests.UpdateRoomCommand:
    properties:
      building_id:
        type: integer
      floor:
        type: integer
      is_active:
        type: boolean
      price:
        type: integer
      room_no:
        type: string
      room_type_id:
        type: integer
      roomID:
        minimum: 1
        type: integer
      size:
        type: integer
    required:
    - roomID
    type: object
  requests.WechatLoginReq:
    properties:
      code:
        type: string
    type: object
  response.BuildingMeterItemResponse:
    properties:
      calc_type:
        type: string
      code:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
      remark:
        type: string
      unit:
        type: string
    type: object
  response.BuildingResponse:
    properties:
      account_id:
        type: integer
      address:
        type: string
      city:
        type: string
      default_meter_items:
        items:
          $ref: '#/definitions/response.BuildingMeterItemResponse'
        type: array
      id:
        type: integer
      name:
        type: string
      province:
        type: string
    type: object
  response.PermissionResponse:
    properties:
      api_path:
        type: string
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
    type: object
  response.RoleResponse:
    properties:
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
    type: object
  response.RoomResponse:
    properties:
      building_id:
        type: integer
      floor:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      price:
        type: integer
      room_no:
        type: string
      room_type_id:
        type: integer
      size:
        type: integer
    type: object
  response.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
info:
  contact: {}
  description: Rent Manager Server
  title: Rent Manager Server API
  version: "1.0"
paths:
  /admin/accounts/{account_id}/roles:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号ID
        in: path
        name: account_id
        required: true
        type: integer
      - description: 角色ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.AccountRolesCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-string'
      security:
      - BearerAuth: []
      summary: 给账号分配角色
      tags:
      - admin
  /admin/permissions/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 权限列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreatePermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_PermissionResponse'
      security:
      - BearerAuth: []
      summary: 批量创建权限
      tags:
      - admin
  /admin/roles/{role_id}/permissions:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      - description: 权限ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.RolePermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-string'
      security:
      - BearerAuth: []
      summary: 删除角色的部分权限
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      - description: 权限ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.RolePermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-string'
      security:
      - BearerAuth: []
      summary: 给角色添加权限
      tags:
      - admin
  /admin/roles/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 角色列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateRolesCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_RoleResponse'
      security:
      - BearerAuth: []
      summary: 批量创建角色
      tags:
      - admin
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 刷新 access token
      parameters:
      - description: 刷新 Token 请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_TokenResponse'
      summary: 刷新 access token
      tags:
      - Account
  /auth/wx-login:
    post:
      consumes:
      - application/json
      description: 微信登录
      parameters:
      - description: 微信登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.WechatLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_TokenResponse'
      summary: 微信登录
      tags:
      - Account
  /buildings:
    get:
      description: 查询楼栋列表
      parameters:
      - in: query
        name: city
        type: string
      - in: query
        name: limit
        type: integer
      - in: query
        name: name
        type: string
      - in: query
        name: offset
        type: integer
      - in: query
        name: province
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_BuildingResponse'
      security:
      - BearerAuth: []
      summary: 查询楼栋列表
      tags:
      - Building
    post:
      consumes:
      - application/json
      description: 创建楼栋并设置默认抄表项
      parameters:
      - description: 创建楼栋请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateBuildingCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_BuildingResponse'
      security:
      - BearerAuth: []
      summary: 创建楼栋
      tags:
      - Building
  /buildings/{building_id}:
    delete:
      description: 删除没有房间的楼栋
      parameters:
      - description: 楼栋 ID
        in: path
        name: building_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 删除楼栋
      tags:
      - Building
    get:
      description: 查询楼栋详情
      parameters:
      - description: 楼栋 ID
        in: path
        name: building_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_BuildingResponse'
      security:
      - BearerAuth: []
      summary: 查询楼栋详情
      tags:
      - Building
    put:
      consumes:
      - application/json
      description: 更新楼栋并整体替换默认抄表项
      parameters:
      - description: 楼栋 ID
        in: path
        name: building_id
        required: true
        type: integer
      - description: 更新楼栋请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.UpdateBuildingCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_BuildingResponse'
      security:
      - BearerAuth: []
      summary: 更新楼栋
      tags:
      - Building
  /buildings/{building_id}/rooms:
    post:
      consumes:
      - application/json
      description: 在指定楼栋下创建房间
      parameters:
      - description: 楼栋 ID
        in: path
        name: building_id
        required: true
        type: integer
      - description: 创建房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateRoomInBuildingCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_RoomResponse'
      security:
      - BearerAuth: []
      summary: 在楼栋下创建房间
      tags:
      - Building
  /rooms:
    get:
      description: 查询房间列表
      parameters:
      - in: query
        minimum: 1
        name: building_id
        required: true
        type: integer
      - in: query
        name: is_active
        type: boolean
      - in: query
        name: limit
        type: integer
      - in: query
        name: offset
        type: integer
      - in: query
        name: room_type_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_RoomResponse'
      summary: 查询房间列表
      tags:
      - Room
    post:
      consumes:
      - application/json
      description: 创建房间
      parameters:
      - description: 创建房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateRoomCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_RoomResponse'
      summary: 创建房间
      tags:
      - Room
  /rooms/{room_id}:
    delete:
      description: 删除房间
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 删除房间
      tags:
      - Room
    get:
      description: 查询单个房间
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_RoomResponse'
      summary: 查询房间
      tags:
      - Room
    put:
      consumes:
      - application/json
      description: 更新房间
      parameters:
      - description: 更新房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.UpdateRoomCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_RoomResponse'
      summary: 更新房间
      tags:
      - Room
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
