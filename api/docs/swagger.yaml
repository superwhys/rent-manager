info:
  contact: {}
  description: Rent Manager Server
  title: Rent Manager Server API
  version: "1.0"
paths:
  /admin/permission-groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_rbac_PermissionGroupResponse'
      security:
      - BearerAuth: []
      summary: 获取权限组列表
      tags:
      - admin
  /admin/permission-groups/{permission_group_id}/permissions:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 权限组ID
        in: path
        name: permission_group_id
        required: true
        type: integer
      - description: 权限编码列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.PermissionGroupPermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 从权限组移除权限
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: 权限组ID
        in: path
        name: permission_group_id
        required: true
        type: integer
      - description: 权限编码列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.PermissionGroupPermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 给权限组绑定权限
      tags:
      - admin
  /admin/permission-groups/batch:
