basePath: /api
definitions:
  account.AccountResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      wechat_openid:
        type: string
    type: object
  auth.RefreshTokenReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.WechatLoginReq:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  ginutils.Ret-account_AccountResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/account.AccountResponse'
      message: {}
    type: object
  ginutils.Ret-any:
    properties:
      code:
        type: integer
      data: {}
      message: {}
    type: object
  ginutils.Ret-array_meteritem_MeterItemResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/meteritem.MeterItemResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_rbac_PermissionGroupResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/rbac.PermissionGroupResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_rbac_PermissionResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/rbac.PermissionResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_rbac_RoleResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/rbac.RoleResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_rbac_UnitGrantResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/rbac.UnitGrantResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_room_RoomResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/room.RoomResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_roomtype_RoomTypeResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/roomtype.RoomTypeResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_unit_UnitResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/unit.UnitResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-auth_TokenResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/auth.TokenResponse'
      message: {}
    type: object
  ginutils.Ret-home_Response:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/home.Response'
      message: {}
    type: object
  ginutils.Ret-meteritem_MeterItemResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/meteritem.MeterItemResponse'
      message: {}
    type: object
  ginutils.Ret-rbac_RoleResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/rbac.RoleResponse'
      message: {}
    type: object
  ginutils.Ret-room_RoomResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/room.RoomResponse'
      message: {}
    type: object
  ginutils.Ret-roomtype_RoomTypeResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/roomtype.RoomTypeResponse'
      message: {}
    type: object
  ginutils.Ret-unit_UnitResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/unit.UnitResponse'
      message: {}
    type: object
  home.BuildingRoomSummaryResponse:
    properties:
      building_count:
        type: integer
      rented_room_count:
        type: integer
      room_count:
        type: integer
      vacant_room_count:
        type: integer
    type: object
  home.Response:
    properties:
      building_room_summary:
        $ref: '#/definitions/home.BuildingRoomSummaryResponse'
      current_month:
        type: string
      income_amount:
        type: string
      income_decimal:
        type: string
      monthly_growth:
        type: string
      stats:
        items:
          $ref: '#/definitions/home.StatResponse'
        type: array
      todos:
        items:
          $ref: '#/definitions/home.TodoResponse'
        type: array
    type: object
  home.StatResponse:
    properties:
      label:
        type: string
      tone:
        type: string
      value:
        type: string
    type: object
  home.TodoResponse:
    properties:
      description:
        type: string
      tag:
        type: string
      title:
        type: string
    type: object
  meteritem.CreateMeterItemCommand:
    properties:
      calc_type:
        enum:
        - DIFFERENCE
        - DIRECT
        type: string
      code:
        maxLength: 255
        type: string
      remark:
        type: string
      unit:
        maxLength: 255
        type: string
      unit_price:
        minimum: 0
        type: integer
    required:
    - code
    - unit
    type: object
  meteritem.MeterItemResponse:
    properties:
      account_id:
        type: integer
      calc_type:
        type: string
      code:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
      remark:
        type: string
      unit:
        type: string
      unit_price:
        type: integer
    type: object
  meteritem.UpdateMeterItemCommand:
    properties:
      calc_type:
        enum:
        - DIFFERENCE
        - DIRECT
        type: string
      code:
        maxLength: 255
        type: string
      meterItemID:
        minimum: 1
        type: integer
      remark:
        type: string
      unit:
        maxLength: 255
        type: string
      unit_price:
        minimum: 0
        type: integer
    required:
    - code
    - meterItemID
    - unit
    type: object
  rbac.CreatePermissionGroupItem:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    required:
    - code
    - name
    type: object
  rbac.CreatePermissionGroupsCommand:
    properties:
      permission_groups:
        items:
          $ref: '#/definitions/rbac.CreatePermissionGroupItem'
        minItems: 1
        type: array
    required:
    - permission_groups
    type: object
  rbac.CreatePermissionItem:
    properties:
      code:
        type: string
      description:
        type: string
    required:
    - code
    - description
    type: object
  rbac.CreatePermissionsCommand:
    properties:
      permissions:
        items:
          $ref: '#/definitions/rbac.CreatePermissionItem'
        minItems: 1
        type: array
    required:
    - permissions
    type: object
  rbac.CreateRoleItem:
    properties:
      is_default_owner:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  rbac.CreateRolesCommand:
    properties:
      roles:
        items:
          $ref: '#/definitions/rbac.CreateRoleItem'
        minItems: 1
        type: array
    required:
    - roles
    type: object
  rbac.PermissionGroupPermissionsCommand:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
      permissionGroupID:
        minimum: 1
        type: integer
    required:
    - permissionGroupID
    - permission_ids
    type: object
  rbac.PermissionGroupResponse:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    type: object
  rbac.PermissionResponse:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
    type: object
  rbac.RolePermissionGroupsCommand:
    properties:
      permission_group_ids:
        items:
          type: integer
        minItems: 1
        type: array
      roleID:
        minimum: 1
        type: integer
    required:
    - permission_group_ids
    - roleID
    type: object
  rbac.RoleResponse:
    properties:
      account_id:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      is_default_owner:
        type: boolean
      name:
        type: string
    type: object
  rbac.UnitAccountRolesCommand:
    properties:
      accountID:
        minimum: 1
        type: integer
      role_ids:
        items:
          type: integer
        minItems: 1
        type: array
      unitID:
        minimum: 1
        type: integer
    required:
    - accountID
    - role_ids
    - unitID
    type: object
  rbac.UnitGrantResponse:
    properties:
      account_id:
        type: integer
      granted_by_account_id:
        type: integer
      id:
        type: integer
      role:
        $ref: '#/definitions/rbac.RoleResponse'
      role_id:
        type: integer
      status:
        type: string
      unit_id:
        type: integer
    type: object
  rbac.UpdateRoleCommand:
    properties:
      is_active:
        type: boolean
      is_default_owner:
        type: boolean
      name:
        type: string
      roleID:
        minimum: 1
        type: integer
    required:
    - name
    - roleID
    type: object
  room.CreateRoomInUnitCommand:
    properties:
      floor:
        type: integer
      meter_item_ids:
        items:
          type: integer
        type: array
      price:
        minimum: 1
        type: integer
      room_no:
        type: string
      room_type_id:
        minimum: 1
        type: integer
      size:
        minimum: 1
        type: integer
      unitID:
        minimum: 1
        type: integer
    required:
    - price
    - room_no
    - room_type_id
    - unitID
    type: object
  room.RoomResponse:
    properties:
      floor:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      meter_items:
        items:
          $ref: '#/definitions/meteritem.MeterItemResponse'
        type: array
      price:
        type: integer
      room_no:
        type: string
      room_type_id:
        type: integer
      size:
        type: integer
      unit_id:
        type: integer
    type: object
  room.UpdateRoomCommand:
    properties:
      floor:
        minimum: 0
        type: integer
      is_active:
        type: boolean
      meter_item_ids:
        items:
          type: integer
        type: array
      price:
        minimum: 0
        type: integer
      room_no:
        type: string
      room_type_id:
        minimum: 1
        type: integer
      roomID:
        minimum: 1
        type: integer
      size:
        minimum: 1
        type: integer
      unit_id:
        minimum: 1
        type: integer
    required:
    - roomID
    type: object
  roomtype.CreateRoomTypeCommand:
    properties:
      name:
        maxLength: 12
        type: string
    required:
    - name
    type: object
  roomtype.RoomTypeResponse:
    properties:
      account_id:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  roomtype.UpdateRoomTypeCommand:
    properties:
      name:
        maxLength: 12
        type: string
      roomTypeID:
        minimum: 1
        type: integer
    required:
    - name
    - roomTypeID
    type: object
  unit.CreateUnitCommand:
    properties:
      address:
        maxLength: 255
        type: string
      city:
        maxLength: 255
        type: string
      default_meter_item_ids:
        items:
          type: integer
        type: array
      name:
        maxLength: 255
        type: string
      province:
        maxLength: 255
        type: string
    required:
    - address
    - city
    - name
    - province
    type: object
  unit.UnitMeterItemResponse:
    properties:
      calc_type:
        type: string
      code:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
      remark:
        type: string
      unit:
        type: string
      unit_price:
        type: integer
    type: object
  unit.UnitResponse:
    properties:
      access_type:
        type: string
      account_id:
        type: integer
      address:
        type: string
      city:
        type: string
      default_meter_items:
        items:
          $ref: '#/definitions/unit.UnitMeterItemResponse'
        type: array
      id:
        type: integer
      is_owner:
        type: boolean
      monthly_rent_amount:
        type: string
      name:
        type: string
      occupancy_status:
        type: string
      province:
        type: string
      rented_count:
        type: integer
      room_count:
        type: integer
    type: object
  unit.UpdateUnitCommand:
    properties:
      address:
        maxLength: 255
        type: string
      city:
        maxLength: 255
        type: string
      default_meter_item_ids:
        items:
          type: integer
        type: array
      name:
        maxLength: 255
        type: string
      province:
        maxLength: 255
        type: string
      unitID:
        minimum: 1
        type: integer
    required:
    - address
    - city
    - name
    - province
    - unitID
    type: object
info:
  contact: {}
  description: Rent Manager Server
  title: Rent Manager Server API
  version: "1.0"
paths:
  /accout/self:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-account_AccountResponse'
      summary: 获取个人信息
      tags:
      - accout
  /admin/permission-groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_rbac_PermissionGroupResponse'
      summary: 获取权限组列表
      tags:
      - admin
  /admin/permission-groups/{permission_group_id}/permissions:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 权限组ID
        in: path
        name: permission_group_id
        required: true
        type: integer
      - description: 权限ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.PermissionGroupPermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 从权限组移除权限
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: 权限组ID
        in: path
        name: permission_group_id
        required: true
        type: integer
      - description: 权限ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.PermissionGroupPermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 给权限组绑定权限
      tags:
      - admin
  /admin/permission-groups/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 权限组列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.CreatePermissionGroupsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_rbac_PermissionGroupResponse'
      summary: 批量创建权限组
      tags:
      - admin
  /admin/permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_rbac_PermissionResponse'
      summary: 获取权限列表
      tags:
      - admin
  /admin/permissions/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 权限列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.CreatePermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_rbac_PermissionResponse'
      summary: 批量创建权限
      tags:
      - admin
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      parameters:
      - description: 刷新令牌参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-auth_TokenResponse'
      summary: 刷新访问令牌
      tags:
      - auth
  /auth/wechat-login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 微信登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.WechatLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-auth_TokenResponse'
      summary: 微信登录
      tags:
      - auth
  /home:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-home_Response'
      summary: 获取首页聚合数据
      tags:
      - home
  /meter-items:
    get:
      parameters:
      - description: 分页数量
        in: query
        name: limit
        type: integer
      - description: 分页偏移
        in: query
        name: offset
        type: integer
      - description: 抄表项编码
        in: query
        name: code
        type: string
      - description: 是否系统内置
        in: query
        name: is_system
        type: boolean
      - description: 计费类型
        in: query
        name: calc_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_meteritem_MeterItemResponse'
      summary: 获取抄表项列表
      tags:
      - meter_item
    post:
      consumes:
      - application/json
      parameters:
      - description: 抄表项信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/meteritem.CreateMeterItemCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-meteritem_MeterItemResponse'
      summary: 创建抄表项
      tags:
      - meter_item
  /meter-items/{meter_item_id}:
    get:
      parameters:
      - description: 抄表项ID
        in: path
        name: meter_item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-meteritem_MeterItemResponse'
      summary: 获取抄表项详情
      tags:
      - meter_item
    put:
      consumes:
      - application/json
      parameters:
      - description: 抄表项ID
        in: path
        name: meter_item_id
        required: true
        type: integer
      - description: 抄表项信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/meteritem.UpdateMeterItemCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-meteritem_MeterItemResponse'
      summary: 更新抄表项
      tags:
      - meter_item
  /roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_rbac_RoleResponse'
      summary: 获取当前账号角色列表
      tags:
      - role
  /roles/{role_id}:
    delete:
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 删除角色
      tags:
      - role
    get:
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-rbac_RoleResponse'
      summary: 获取角色详情
      tags:
      - role
    put:
      consumes:
      - application/json
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      - description: 角色信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.UpdateRoleCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-rbac_RoleResponse'
      summary: 更新角色
      tags:
      - role
  /roles/{role_id}/permission-groups:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      - description: 权限组ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.RolePermissionGroupsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 从角色移除权限组
      tags:
      - role
    post:
      consumes:
      - application/json
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      - description: 权限组ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.RolePermissionGroupsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 给角色绑定权限组
      tags:
      - role
  /roles/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 角色列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rbac.CreateRolesCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_rbac_RoleResponse'
      summary: 批量创建角色
      tags:
