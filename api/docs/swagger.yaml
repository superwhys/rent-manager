basePath: /api
definitions:
  ginutils.Ret-any:
    properties:
      code:
        type: integer
      data: {}
      message: {}
    type: object
  ginutils.Ret-array_response_MeterItemResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.MeterItemResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_response_PermissionGroupResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.PermissionGroupResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_response_PermissionResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.PermissionResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_response_RoleResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.RoleResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_response_RoomResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.RoomResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_response_UnitResponse:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/response.UnitResponse'
        type: array
      message: {}
    type: object
  ginutils.Ret-response_MeterItemResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/response.MeterItemResponse'
      message: {}
    type: object
  ginutils.Ret-response_RoomResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/response.RoomResponse'
      message: {}
    type: object
  ginutils.Ret-response_TokenResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/response.TokenResponse'
      message: {}
    type: object
  ginutils.Ret-response_UnitResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/response.UnitResponse'
      message: {}
    type: object
  ginutils.Ret-string:
    properties:
      code:
        type: integer
      data:
        type: string
      message: {}
    type: object
  requests.CreateMeterItemCommand:
    properties:
      calc_type:
        enum:
        - DIFFERENCE
        - DIRECT
        type: string
      code:
        maxLength: 255
        type: string
      remark:
        type: string
      unit:
        maxLength: 255
        type: string
    required:
    - code
    - unit
    type: object
  requests.CreatePermissionGroupItem:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    required:
    - code
    - name
    type: object
  requests.CreatePermissionGroupsCommand:
    properties:
      permission_groups:
        items:
          $ref: '#/definitions/requests.CreatePermissionGroupItem'
        minItems: 1
        type: array
    required:
    - permission_groups
    type: object
  requests.CreatePermissionItem:
    properties:
      api_path:
        type: string
      code:
        type: string
      description:
        type: string
    required:
    - api_path
    - code
    - description
    type: object
  requests.CreatePermissionsCommand:
    properties:
      permissions:
        items:
          $ref: '#/definitions/requests.CreatePermissionItem'
        minItems: 1
        type: array
    required:
    - permissions
    type: object
  requests.CreateRoleItem:
    properties:
      is_default_owner:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  requests.CreateRolesCommand:
    properties:
      roles:
        items:
          $ref: '#/definitions/requests.CreateRoleItem'
        minItems: 1
        type: array
    required:
    - roles
    type: object
  requests.CreateRoomCommand:
    properties:
      floor:
        type: integer
      meter_item_ids:
        items:
          type: integer
        type: array
      price:
        minimum: 1
        type: integer
      room_no:
        type: string
      room_type_id:
        minimum: 1
        type: integer
      size:
        type: integer
      unit_id:
        minimum: 1
        type: integer
    required:
    - price
    - room_no
    - room_type_id
    - unit_id
    type: object
  requests.CreateRoomInUnitCommand:
    properties:
      floor:
        type: integer
      meter_item_ids:
        items:
          type: integer
        type: array
      price:
        minimum: 1
        type: integer
      room_no:
        type: string
      room_type_id:
        minimum: 1
        type: integer
      size:
        minimum: 1
        type: integer
      unitID:
        minimum: 1
        type: integer
    required:
    - price
    - room_no
    - room_type_id
    - size
    - unitID
    type: object
  requests.CreateUnitCommand:
    properties:
      address:
        maxLength: 255
        type: string
      city:
        maxLength: 255
        type: string
      default_meter_item_ids:
        items:
          type: integer
        type: array
      name:
        maxLength: 255
        type: string
      province:
        maxLength: 255
        type: string
    required:
    - address
    - city
    - name
    - province
    type: object
  requests.PermissionGroupPermissionsCommand:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
      permissionGroupID:
        minimum: 1
        type: integer
    required:
    - permissionGroupID
    - permission_ids
    type: object
  requests.RefreshTokenReq:
    properties:
      refresh_token:
        type: string
    type: object
  requests.RolePermissionGroupsCommand:
    properties:
      permission_group_ids:
        items:
          type: integer
        minItems: 1
        type: array
      roleID:
        minimum: 1
        type: integer
    required:
    - permission_group_ids
    - roleID
    type: object
  requests.UnitAccountRolesCommand:
    properties:
      accountID:
        minimum: 1
        type: integer
      role_ids:
        items:
          type: integer
        minItems: 1
        type: array
      unitID:
        minimum: 1
        type: integer
    required:
    - accountID
    - role_ids
    - unitID
    type: object
  requests.UpdateMeterItemCommand:
    properties:
      calc_type:
        enum:
        - DIFFERENCE
        - DIRECT
        type: string
      code:
        maxLength: 255
        type: string
      meterItemID:
        minimum: 1
        type: integer
      remark:
        type: string
      unit:
        maxLength: 255
        type: string
    required:
    - code
    - meterItemID
    - unit
    type: object
  requests.UpdateRoomCommand:
    properties:
      floor:
        type: integer
      is_active:
        type: boolean
      meter_item_ids:
        items:
          type: integer
        type: array
      price:
        type: integer
      room_no:
        type: string
      room_type_id:
        type: integer
      roomID:
        minimum: 1
        type: integer
      size:
        type: integer
      unit_id:
        type: integer
    required:
    - roomID
    type: object
  requests.UpdateUnitCommand:
    properties:
      address:
        maxLength: 255
        type: string
      city:
        maxLength: 255
        type: string
      default_meter_item_ids:
        items:
          type: integer
        type: array
      name:
        maxLength: 255
        type: string
      province:
        maxLength: 255
        type: string
      unitID:
        minimum: 1
        type: integer
    required:
    - address
    - city
    - name
    - province
    - unitID
    type: object
  requests.WechatLoginReq:
    properties:
      code:
        type: string
    type: object
  response.MeterItemResponse:
    properties:
      account_id:
        type: integer
      calc_type:
        type: string
      code:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
      remark:
        type: string
      unit:
        type: string
    type: object
  response.PermissionGroupResponse:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    type: object
  response.PermissionResponse:
    properties:
      api_path:
        type: string
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
    type: object
  response.RoleResponse:
    properties:
      account_id:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      is_default_owner:
        type: boolean
      name:
        type: string
    type: object
  response.RoomResponse:
    properties:
      floor:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      meter_items:
        items:
          $ref: '#/definitions/response.MeterItemResponse'
        type: array
      price:
        type: integer
      room_no:
        type: string
      room_type_id:
        type: integer
      size:
        type: integer
      unit_id:
        type: integer
    type: object
  response.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  response.UnitMeterItemResponse:
    properties:
      calc_type:
        type: string
      code:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
      remark:
        type: string
      unit:
        type: string
    type: object
  response.UnitResponse:
    properties:
      account_id:
        type: integer
      address:
        type: string
      city:
        type: string
      default_meter_items:
        items:
          $ref: '#/definitions/response.UnitMeterItemResponse'
        type: array
      id:
        type: integer
      name:
        type: string
      province:
        type: string
    type: object
info:
  contact: {}
  description: Rent Manager Server
  title: Rent Manager Server API
  version: "1.0"
paths:
  /admin/permission-groups:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_PermissionGroupResponse'
      security:
      - BearerAuth: []
      summary: 获取权限组列表
      tags:
      - admin
  /admin/permission-groups/{permission_group_id}/permissions:
    post:
      consumes:
      - application/json
      parameters:
      - description: 权限组ID
        in: path
        name: permission_group_id
        required: true
        type: integer
      - description: 权限ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.PermissionGroupPermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-string'
      security:
      - BearerAuth: []
      summary: 给权限组绑定权限
      tags:
      - admin
  /admin/permission-groups/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 权限组列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreatePermissionGroupsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_PermissionGroupResponse'
      security:
      - BearerAuth: []
      summary: 批量创建权限组
      tags:
      - admin
  /admin/permissions:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_PermissionResponse'
      security:
      - BearerAuth: []
      summary: 获取权限列表
      tags:
      - admin
  /admin/permissions/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 权限列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreatePermissionsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_PermissionResponse'
      security:
      - BearerAuth: []
      summary: 批量创建权限
      tags:
      - admin
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 刷新 access token
      parameters:
      - description: 刷新 Token 请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_TokenResponse'
      summary: 刷新 access token
      tags:
      - Account
  /auth/wx-login:
    post:
      consumes:
      - application/json
      description: 微信登录
      parameters:
      - description: 微信登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.WechatLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_TokenResponse'
      summary: 微信登录
      tags:
      - Account
  /meter-items:
    get:
      description: 查询当前账号的抄表项列表
      parameters:
      - enum:
        - DIFFERENCE
        - DIRECT
        in: query
        name: calc_type
        type: string
      - in: query
        name: code
        type: string
      - in: query
        name: is_system
        type: boolean
      - in: query
        name: limit
        type: integer
      - in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_MeterItemResponse'
      security:
      - BearerAuth: []
      summary: 查询抄表项列表
      tags:
      - MeterItem
    post:
      consumes:
      - application/json
      description: 为当前账号创建抄表项
      parameters:
      - description: 创建抄表项请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateMeterItemCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_MeterItemResponse'
      security:
      - BearerAuth: []
      summary: 创建抄表项
      tags:
      - MeterItem
  /meter-items/{meter_item_id}:
    put:
      consumes:
      - application/json
      description: 更新当前账号的抄表项
      parameters:
      - description: 抄表项 ID
        in: path
        name: meter_item_id
        required: true
        type: integer
      - description: 更新抄表项请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.UpdateMeterItemCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_MeterItemResponse'
      security:
      - BearerAuth: []
      summary: 更新抄表项
      tags:
      - MeterItem
  /roles/{role_id}/permission-groups:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      - description: 权限组ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.RolePermissionGroupsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-string'
      security:
      - BearerAuth: []
      summary: 从账号角色移除权限组
      tags:
      - role
    post:
      consumes:
      - application/json
      parameters:
      - description: 角色ID
        in: path
        name: role_id
        required: true
        type: integer
      - description: 权限组ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.RolePermissionGroupsCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-string'
      security:
      - BearerAuth: []
      summary: 给账号角色绑定权限组
      tags:
      - role
  /roles/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 角色列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateRolesCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_RoleResponse'
      security:
      - BearerAuth: []
      summary: 批量创建账号角色
      tags:
      - role
  /rooms:
    get:
      description: 查询房间列表
      parameters:
      - in: query
        name: is_active
        type: boolean
      - in: query
        name: limit
        type: integer
      - in: query
        name: offset
        type: integer
      - in: query
        name: room_type_id
        type: integer
      - in: query
        minimum: 1
        name: unit_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_RoomResponse'
      security:
      - BearerAuth: []
      summary: 查询房间列表
      tags:
      - Room
    post:
      consumes:
      - application/json
      description: 创建房间
      parameters:
      - description: 创建房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateRoomCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_RoomResponse'
      security:
      - BearerAuth: []
      summary: 创建房间
      tags:
      - Room
  /rooms/{room_id}:
    delete:
      description: 删除房间
      parameters:
      - description: 房间 ID
        in: path
        name: room_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 删除房间
      tags:
      - Room
    get:
      description: 查询单个房间
      parameters:
      - description: 房间 ID
        in: path
        name: room_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_RoomResponse'
      security:
      - BearerAuth: []
      summary: 查询房间
      tags:
      - Room
    put:
      consumes:
      - application/json
      description: 更新房间
      parameters:
      - description: 房间 ID
        in: path
        name: room_id
        required: true
        type: integer
      - description: 更新房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.UpdateRoomCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_RoomResponse'
      security:
      - BearerAuth: []
      summary: 更新房间
      tags:
      - Room
  /units:
    get:
      description: 查询当前账号的单元列表
      parameters:
      - in: query
        name: city
        type: string
      - in: query
        name: limit
        type: integer
      - in: query
        name: name
        type: string
      - in: query
        name: offset
        type: integer
      - in: query
        name: province
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_response_UnitResponse'
      security:
      - BearerAuth: []
      summary: 查询单元列表
      tags:
      - Unit
    post:
      consumes:
      - application/json
      description: 创建单元并设置默认抄表项
      parameters:
      - description: 创建单元请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateUnitCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_UnitResponse'
      security:
      - BearerAuth: []
      summary: 创建单元
      tags:
      - Unit
  /units/{unit_id}:
    delete:
      description: 删除没有房间的单元
      parameters:
      - description: 单元 ID
        in: path
        name: unit_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 删除单元
      tags:
      - Unit
    get:
      description: 查询当前账号的单元详情
      parameters:
      - description: 单元 ID
        in: path
        name: unit_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_UnitResponse'
      security:
      - BearerAuth: []
      summary: 查询单元详情
      tags:
      - Unit
    put:
      consumes:
      - application/json
      description: 更新单元并整体替换默认抄表项
      parameters:
      - description: 单元 ID
        in: path
        name: unit_id
        required: true
        type: integer
      - description: 更新单元请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.UpdateUnitCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-response_UnitResponse'
      security:
      - BearerAuth: []
      summary: 更新单元
      tags:
      - Unit
  /units/{unit_id}/accounts/{account_id}/roles:
    post:
      consumes:
      - application/json
      parameters:
      - description: 单元ID
        in: path
        name: unit_id
        required: true
        type: integer
      - description: 账号ID
        in: path
        name: account_id
        required: true
        type: integer
      - description: 角色ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.UnitAccountRolesCommand'
